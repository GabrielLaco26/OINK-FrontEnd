<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FB88B7">
  <title>Histórico · Oink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icones/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
  <script type="module" src="js/paginas/historico.js"></script>
</head>
<body>
  <main class="app">
    <header class="cabecalho">
      <a class="btn-icone" href="inicio.html" aria-label="Voltar ao início">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>Histórico</h1>
    </header>

    <div class="conteudo">
      <div class="filtros">
        <div class="chips" role="group" aria-label="Período">
          <span class="chips__rotulo" aria-hidden="true">Período</span>
          <button type="button" class="chip" data-dias="7" aria-pressed="false">7 dias</button>
          <button type="button" class="chip" data-dias="30" aria-pressed="true">30 dias</button>
          <button type="button" class="chip" data-dias="90" aria-pressed="false">90 dias</button>
        </div>
        <div class="chips" role="group" aria-label="Tipo">
          <span class="chips__rotulo" aria-hidden="true">Tipo</span>
          <button type="button" class="chip" data-tipo="todas" aria-pressed="true">Tudo</button>
          <button type="button" class="chip" data-tipo="enviadas" aria-pressed="false">Enviados</button>
          <button type="button" class="chip" data-tipo="recebidas" aria-pressed="false">Recebidos</button>
        </div>
      </div>

      <p class="status-lista" id="status" role="status">Carregando…</p>
      <div id="lista" aria-live="polite"></div>

      <div class="estado estado--vazio" id="vazio" hidden>
        <img src="assets/img/rosto-rosa.png" alt="" width="90">
        <h2>Nenhuma transação aqui</h2>
        <p>Tente outro período ou tipo.</p>
      </div>
    </div>
  </main>
</body>
</html>
