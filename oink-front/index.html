<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FB88B7">
  <meta name="description" content="Oink — banco digital (projeto acadêmico)">
  <title>Oink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icones/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Oink">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>
  <a class="app abertura" id="abertura" href="boas-vindas.html" aria-label="Oink — toque para começar">
    <img class="abertura__logo" src="assets/img/logo-oink.png" alt="Oink">
    <img class="abertura__porquinho" src="assets/img/porquinho-espiando.png" alt="">
  </a>

  <script type="module">
    import { registrarServiceWorker } from './js/ui.js';
    import { estaLogado } from './js/sessao.js';

    registrarServiceWorker();
    const destino = estaLogado() ? 'inicio.html' : 'boas-vindas.html';
    document.getElementById('abertura').href = destino;
    setTimeout(() => location.replace(destino), 1500);
  </script>
</body>
</html>
