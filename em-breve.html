<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FB88B7">
  <title>Em breve · Oink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icones/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>
  <main class="app">
    <header class="cabecalho">
      <a class="btn-icone" href="menu.html" id="voltar" aria-label="Voltar">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>Em breve</h1>
    </header>

    <div class="conteudo conteudo--estreito" style="padding-top: 48px">
      <img class="mascote" style="width: 170px" src="assets/img/rosto-rosa.png" alt="">
      <h2 class="titulo-central">Essa área ainda está em construção</h2>
      <p class="texto-central">O porquinho está preparando essa funcionalidade. Enquanto isso, você já pode fazer Pix e consultar seu histórico.</p>
      <div class="grupo-botoes empurra-baixo">
        <a class="btn btn--primario" href="pix.html">Fazer um Pix</a>
        <a class="btn btn--contorno" href="menu.html">Voltar ao menu</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { iniciarPagina } from './js/paginas/comum.js';
    import { $ } from './js/ui.js';

    iniciarPagina({ menu: null });
    // Volta para a tela de onde a pessoa veio, se houver
    $('#voltar').addEventListener('click', (evento) => {
      if (history.length > 1 && document.referrer.startsWith(location.origin)) {
        evento.preventDefault();
        history.back();
      }
    });
  </script>
</body>
</html>
