<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FB88B7">
  <title>Início · Oink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icones/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
  <script type="module" src="js/paginas/inicio.js"></script>
</head>
<body>
  <main class="app">
    <header class="topo-inicio">
      <div class="saudacao">
        <a class="saudacao__perfil" href="perfil.html" aria-label="Meu perfil">
          <span class="avatar" id="iniciais" aria-hidden="true"></span>
          <span><small>Olá,</small><strong id="primeiro-nome">&nbsp;</strong></span>
        </a>
        <div class="saudacao__acoes">
          <a class="btn-icone btn-icone--creme" href="em-breve.html" aria-label="Ajuda">?</a>
          <a class="btn-icone btn-icone--creme" href="em-breve.html" aria-label="Notificações">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          </a>
        </div>
      </div>

      <section class="saldo" aria-label="Saldo da conta">
        <div class="saldo__topo">
          <span class="saldo__rotulo">
            <span class="saldo__icone"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM3 10h18M16 14.5h2"/></svg></span>
            Saldo em conta
          </span>
          <button type="button" class="btn-icone" id="olho-saldo"></button>
        </div>
        <p class="saldo__valor" id="saldo" aria-live="polite">R$ ••••</p>
        <p class="saldo__conta" id="dados-conta">&nbsp;</p>
      </section>
    </header>

    <div class="conteudo">
      <nav class="atalhos" aria-label="Atalhos">
        <a class="atalho" href="pix.html">
          <span class="atalho__icone"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l3.5 3.5-3.5 3.5L8.5 6zM12 14.5l3.5 3.5-3.5 3.5-3.5-3.5zM2.5 12L6 8.5 9.5 12 6 15.5zM14.5 12L18 8.5l3.5 3.5-3.5 3.5z"/></svg></span>
          Pix
        </a>
        <a class="atalho" href="historico.html">
          <span class="atalho__icone"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg></span>
          Histórico
        </a>
        <a class="atalho" href="cofrinho.html">
          <span class="atalho__icone"><img src="assets/img/rosto-rosa.png" alt=""></span>
          Cofrinho
        </a>
        <a class="atalho" href="cartao.html">
          <span class="atalho__icone"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM3 10h18"/></svg></span>
          Cartão
        </a>
      </nav>

      <section class="cartao cartao--padding" aria-labelledby="titulo-extrato">
        <div class="cartao__topo">
          <h2 id="titulo-extrato">Extrato recente</h2>
          <a class="link-seta" href="historico.html">Ver tudo
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </a>
        </div>
        <ul class="transacoes" id="extrato" aria-busy="true"></ul>
        <p class="lista-vazia" id="extrato-status">Carregando…</p>
      </section>
    </div>
  </main>
</body>
</html>
