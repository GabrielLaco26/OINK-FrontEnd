<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FB88B7">
  <title>Recuperar senha · Oink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icones/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>
  <main class="app tela-acesso">
    <div class="acesso-topo">
      <a class="btn-icone" href="entrar.html" aria-label="Voltar para o login">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <img class="logo" src="assets/img/logo-oink.png" alt="Oink">
    </div>

    <section class="folha">
      <img class="folha__porquinho" src="assets/img/porquinho-espiando.png" alt="">
      <div style="display: flex; align-items: center; gap: 10px">
        <h1>Recuperar senha</h1>
        <span class="selo">Em breve</span>
      </div>
      <p class="subtitulo">Informe seu CPF para receber as instruções de redefinição de senha.</p>

      <!-- Recuperação de senha (RF03) ainda não funciona: o envio mostra "Em breve" -->
      <form class="formulario formulario--cheio" id="form" novalidate>
        <div class="campo">
          <label for="cpf">CPF</label>
          <input class="input" id="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00">
        </div>
        <div class="aviso aviso--alerta" id="em-breve" role="status" hidden>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM12 7v5l3 2"/></svg>
          <span><strong>Em breve.</strong> A recuperação de senha ainda está em construção. Por enquanto, entre com a senha que você cadastrou.</span>
        </div>
        <button class="btn btn--primario empurra-baixo" id="enviar" type="submit">Enviar instruções</button>
        <a class="btn btn--primario empurra-baixo" id="voltar-login" href="entrar.html" hidden>Voltar para o login</a>
      </form>
    </section>
  </main>

  <script type="module">
    import { iniciarPagina } from './js/paginas/comum.js';
    import { $, mascaraCPF } from './js/ui.js';

    iniciarPagina({ exigeLogin: false });
    mascaraCPF($('#cpf'));
    $('#form').addEventListener('submit', (evento) => {
      evento.preventDefault();
      $('#em-breve').hidden = false;
      $('#enviar').hidden = true;
      $('#voltar-login').hidden = false;
    });
  </script>
</body>
</html>
