<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FB88B7">
  <title>Meu perfil · Oink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icones/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
  <script type="module" src="js/paginas/perfil.js"></script>
</head>
<body>
  <main class="app">
    <header class="topo-perfil">
      <a class="btn-icone" href="menu.html" aria-label="Voltar ao menu">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>Meu perfil</h1>
      <span class="avatar avatar--grande" id="iniciais" aria-hidden="true"></span>
    </header>

    <div class="perfil-nome">
      <p id="nome">&nbsp;</p>
      <small>Conta Oink</small>
    </div>

    <div class="conteudo" style="padding-top: 18px">
      <p class="status-lista" id="status" role="status">Carregando…</p>

      <dl class="cartao dados" id="dados" hidden>
        <div class="dados__linha dados__linha--destaque">
          <div class="dados__texto"><dt>Sua chave para receber (seu CPF)</dt><dd id="d-chave"></dd></div>
          <button type="button" class="btn-icone btn-copiar" data-copiar="d-chave" data-msg="CPF copiado!" aria-label="Copiar CPF (chave para receber)"></button>
        </div>
        <div class="dados__linha">
          <div class="dados__texto"><dt>Número da conta</dt><dd id="d-conta"></dd></div>
          <button type="button" class="btn-icone btn-copiar" data-copiar="d-conta" data-msg="Número da conta copiado!" aria-label="Copiar número da conta"></button>
        </div>
        <div class="dados__linha">
          <div class="dados__texto"><dt>Agência</dt><dd id="d-agencia"></dd></div>
          <button type="button" class="btn-icone btn-copiar" data-copiar="d-agencia" data-msg="Agência copiada!" aria-label="Copiar agência"></button>
        </div>
        <div class="dados__linha"><div class="dados__texto"><dt>Telefone</dt><dd id="d-telefone"></dd></div></div>
        <div class="dados__linha"><div class="dados__texto"><dt>E-mail</dt><dd id="d-email"></dd></div></div>
        <div class="dados__linha"><div class="dados__texto"><dt>Data de nascimento</dt><dd id="d-nascimento"></dd></div></div>
        <div class="dados__linha"><div class="dados__texto"><dt>Nome completo da mãe</dt><dd id="d-mae"></dd></div></div>
      </dl>

      <div class="grupo-botoes" style="gap: 6px">
        <button type="button" class="btn btn--contorno" id="sair">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Sair da conta
        </button>
        <a class="btn btn--texto-perigo" href="encerrar-conta.html">Encerrar conta</a>
      </div>
    </div>
  </main>
</body>
</html>
