<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FB88B7">
  <title>Entrar · Oink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icones/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
  <script type="module" src="js/paginas/entrar.js"></script>
</head>
<body>
  <main class="app tela-acesso">
    <div class="acesso-topo">
      <a class="btn-icone" href="boas-vindas.html" aria-label="Voltar">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <img class="logo" src="assets/img/logo-oink.png" alt="Oink">
    </div>

    <section class="folha">
      <img class="folha__porquinho" src="assets/img/porquinho-espiando.png" alt="">
      <h1>Entrar na sua conta</h1>
      <p class="subtitulo">Use seu CPF e a senha cadastrada.</p>

      <div class="aviso aviso--info" id="modo-teste" hidden>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM12 16v-4M12 8h.01"/></svg>
        <span><strong>Modo de teste:</strong> CPF 123.456.789-09 e senha oink1234.</span>
      </div>

      <div class="aviso aviso--erro" id="aviso" role="alert" hidden>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM12 8v5M12 16h.01"/></svg>
        <span id="aviso-texto"></span>
      </div>

      <form class="formulario formulario--cheio" id="form" novalidate>
        <div class="campo">
          <label for="cpf">CPF</label>
          <input class="input" id="cpf" name="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" aria-describedby="erro-cpf">
          <span class="erro-campo" id="erro-cpf"></span>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <div class="input-senha">
            <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" aria-describedby="erro-senha">
            <button type="button" class="btn-icone" data-olho="senha"></button>
          </div>
          <span class="erro-campo" id="erro-senha"></span>
        </div>
        <a class="link-esqueci" href="recuperar-senha.html">Esqueci minha senha</a>
        <button class="btn btn--primario empurra-baixo" type="submit">Entrar</button>
      </form>

      <p class="rodape-texto">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </section>
  </main>
</body>
</html>
