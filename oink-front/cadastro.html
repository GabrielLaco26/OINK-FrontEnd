<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FB88B7">
  <title>Criar conta · Oink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icones/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
  <script type="module" src="js/paginas/cadastro.js"></script>
</head>
<body>
  <main class="app tela-acesso">
    <div class="acesso-topo acesso-topo--baixo">
      <a class="btn-icone" id="voltar" href="boas-vindas.html" aria-label="Voltar">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <img class="logo" src="assets/img/logo-oink.png" alt="Oink">
    </div>

    <section class="folha">
      <img class="folha__porquinho" src="assets/img/porquinho-espiando.png" alt="">

      <div class="etapas">
        <span id="etapa-texto">Etapa 1 de 2</span>
        <div class="etapas__barra" aria-hidden="true"><i class="feita"></i><i id="etapa-barra-2"></i></div>
      </div>
      <h1 id="titulo">Seus dados pessoais</h1>

      <div class="aviso aviso--erro" id="aviso" role="alert" hidden>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM12 8v5M12 16h.01"/></svg>
        <span id="aviso-texto"></span>
      </div>

      <!-- Etapa 1: dados pessoais -->
      <form class="formulario formulario--cheio" id="form-1" novalidate>
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input class="input" id="nome" maxlength="100" autocomplete="name" placeholder="Digite seu nome completo" aria-describedby="erro-nome">
          <span class="erro-campo" id="erro-nome"></span>
        </div>
        <div class="campo">
          <label for="nome-mae">Nome da mãe</label>
          <input class="input" id="nome-mae" maxlength="100" placeholder="Digite o nome completo da mãe" aria-describedby="erro-nome-mae">
          <span class="erro-campo" id="erro-nome-mae"></span>
        </div>
        <div class="linha-2">
          <div class="campo">
            <label for="cpf">CPF</label>
            <input class="input" id="cpf" inputmode="numeric" placeholder="000.000.000-00" aria-describedby="erro-cpf">
            <span class="erro-campo" id="erro-cpf"></span>
          </div>
          <div class="campo">
            <label for="nascimento">Nascimento</label>
            <input class="input" id="nascimento" inputmode="numeric" autocomplete="bday" placeholder="dd/mm/aaaa" aria-describedby="erro-nascimento">
            <span class="erro-campo" id="erro-nascimento"></span>
          </div>
        </div>
        <button class="btn btn--primario empurra-baixo" type="submit">Avançar</button>
      </form>

      <!-- Etapa 2: contato e senha -->
      <form class="formulario formulario--cheio" id="form-2" novalidate hidden>
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input class="input" id="telefone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000" aria-describedby="erro-telefone">
          <span class="erro-campo" id="erro-telefone"></span>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input class="input" id="email" type="email" maxlength="120" autocomplete="email" placeholder="seuemail@exemplo.com" aria-describedby="erro-email">
          <span class="erro-campo" id="erro-email"></span>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <div class="input-senha">
            <input id="senha" type="password" maxlength="72" autocomplete="new-password" placeholder="Crie uma senha" aria-describedby="dica-senha erro-senha">
            <button type="button" class="btn-icone" data-olho="senha"></button>
          </div>
          <span class="dica" id="dica-senha">Use pelo menos 8 caracteres.</span>
          <span class="erro-campo" id="erro-senha"></span>
        </div>
        <div class="campo">
          <label for="confirmacao">Confirmação da senha</label>
          <div class="input-senha">
            <input id="confirmacao" type="password" maxlength="72" autocomplete="new-password" placeholder="Repita a senha" aria-describedby="erro-confirmacao">
            <button type="button" class="btn-icone" data-olho="confirmacao"></button>
          </div>
          <span class="erro-campo" id="erro-confirmacao"></span>
        </div>
        <button class="btn btn--primario empurra-baixo" type="submit">Criar conta</button>
      </form>

      <p class="rodape-texto" id="ja-tem-conta">Já tem conta? <a href="entrar.html">Entrar</a></p>
    </section>
  </main>
</body>
</html>
