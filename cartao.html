<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FB88B7">
  <title>Cartão · Oink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icones/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>
  <main class="app">
    <header class="cabecalho cabecalho--sem-voltar">
      <h1>Cartão</h1>
      <span class="selo">Simulação</span>
    </header>

    <!-- RF12: cartão de crédito/débito é só demonstrativo, sem movimentar saldo -->
    <div class="conteudo">
      <div class="cartao-virtual" role="img" aria-label="Cartão virtual Oink, final 0000">
        <div class="cartao-virtual__topo">
          <img src="assets/img/logo-oink.png" alt="">
          <span>VIRTUAL</span>
        </div>
        <span class="cartao-virtual__numero">•••• •••• •••• 0000</span>
        <div class="cartao-virtual__base">
          <div><small>Titular</small><strong id="titular">&nbsp;</strong></div>
          <div style="text-align: right"><small>Validade</small><strong>00/00</strong></div>
        </div>
      </div>

      <div class="acoes-grade">
        <a class="acao" href="em-breve.html"><span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"/></svg></span>Bloquear cartão</a>
        <a class="acao" href="em-breve.html"><span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg></span>Ver dados</a>
        <a class="acao" href="em-breve.html"><span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17a8.5 8.5 0 0 1 17 0M12 17l4-5M6.5 17h.01M17.5 17h.01M12 8.5v.01"/></svg></span>Ajustar limite</a>
        <a class="acao" href="em-breve.html"><span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM14 2v6h6M8 13h8M8 17h5"/></svg></span>Fatura</a>
      </div>

      <div class="aviso aviso--info">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM12 16v-4M12 8h.01"/></svg>
        <span>Cartão de crédito e débito são apenas uma simulação: nada nesta tela movimenta o seu saldo.</span>
      </div>
    </div>
  </main>

  <script type="module">
    import { iniciarPagina } from './js/paginas/comum.js';
    import { obterNome } from './js/sessao.js';
    import { $ } from './js/ui.js';

    if (iniciarPagina({ menu: 'cartao' })) $('#titular').textContent = obterNome();
  </script>
</body>
</html>
